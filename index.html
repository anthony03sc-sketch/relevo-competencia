<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relevo de Competencia</title>
<style>
:root{--purple:#49318f;--purple-dark:#30205f;--bg:#f4f5f8;--line:#e2e4eb;--txt:#202535;--sub:#687083;--green:#16835f;--surface:#fff;--focus:#6d4db6}
*{box-sizing:border-box}
html{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
header{background:var(--purple-dark);color:#fff;padding:20px 20px 21px;border-bottom:3px solid #8e78d5}
header>div,.container{max-width:1000px;margin:0 auto}
header h1{font-size:21px;font-weight:750;margin:0;letter-spacing:-.45px;line-height:1.3}
header small{display:none}
h2{font-size:18px;letter-spacing:-.25px;font-weight:720;margin:0 0 14px}h3{font-size:15px;font-weight:700;margin:0 0 13px}
small,.muted,.note{color:var(--sub)}
.container{padding:25px 20px 116px}
.panel{background:var(--surface);border:1px solid var(--line);padding:24px;border-radius:12px;margin:0 0 16px;box-shadow:0 2px 10px rgba(25,28,50,.035)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stack{display:flex;flex-direction:column;gap:12px}
label{font-weight:650;font-size:13px;display:block;margin-bottom:7px}
input,select,textarea{width:100%;min-height:44px;padding:11px 13px;border-radius:8px;border:1px solid #cdd2dd;background:#fff;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--focus);box-shadow:0 0 0 3px rgba(109,77,182,.13)}
textarea{resize:vertical;min-height:85px}input[type=checkbox]{width:17px;height:17px;min-height:0;accent-color:var(--purple);flex-shrink:0;margin:0}
button{border:1px solid transparent;border-radius:8px;padding:11px 17px;min-height:43px;background:var(--purple);color:#fff;font:inherit;font-weight:680;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s}
button:hover{background:var(--purple-dark)}button:focus-visible{outline:3px solid #b4a0ec;outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#f3f0fa;color:#49318f;border-color:#e2daf3}.secondary:hover{background:#e8dff7}.outline{background:#fff;border-color:#cec6e3;color:var(--purple)}.outline:hover{background:#f7f4fc}
.success{background:var(--green)}.success:hover{background:#116a4b}
.chip{display:inline-flex;align-items:center;gap:9px;border:1px solid #d9dce6;padding:10px 13px;border-radius:8px;background:#fff;font-weight:520;margin:0;cursor:pointer;min-height:43px}
.chips{display:flex;flex-wrap:wrap;gap:9px}.chip:has(input:checked){background:#f1edfa;border-color:#8f78cd;color:#37226e}
.pill{font-size:12px;padding:5px 11px;border-radius:7px;font-weight:700;background:#f1edf9;color:#573b94;white-space:nowrap}
.pill.done{background:#e5f5ec;color:#136343}.pill.draft{background:#fff5df;color:#8a5e11}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px;margin-top:12px}
.item{background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px;text-align:left;color:var(--txt);display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:66px}
.item:hover{border-color:#9a87c7;background:#faf9fd}.item strong{font-size:13px;font-weight:660;line-height:1.4;overflow-wrap:anywhere}
.group{padding:19px;border:1px solid var(--line);border-radius:10px;margin:12px 0;background:#fff}.brand{border-left:3px solid var(--purple)}.role{background:#fafbfc;border-left:0}
.row{display:flex;gap:11px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -3px 16px rgba(20,23,40,.035)}
.footer>div{max-width:1000px;margin:auto;display:flex;justify-content:space-between;gap:12px}.footBtn{flex:1}
.sectionTag{font-size:12px;color:#69539c;font-weight:720;letter-spacing:.035em;text-transform:uppercase;margin:19px 0 10px}
.info{background:#f2f0f8;padding:12px;border-radius:8px;color:#4f3e77}.progress{background:#e9e8ee;height:6px;border-radius:99px;overflow:hidden;margin:14px 0 10px}.progress i{height:100%;display:block;background:var(--purple)}
.note{font-size:12px}.hidden{display:none!important}.err{border-color:#d44545!important}.wide{grid-column:1/-1}.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.title-row h2{margin:0}
details{padding:5px 0}summary{font-weight:650}p{margin:8px 0 14px}
@media(max-width:600px){header{padding:16px 16px 17px}header h1{font-size:19px}.container{padding:14px 11px 104px}.panel{padding:17px 14px;border-radius:10px}.grid{gap:11px}.three{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:12px}.chips .chip{flex:1 1 42%}.group{padding:14px}.desktop-hide{display:none}.footer{padding-inline:12px}.row button{font-size:13px}}
@media(max-width:365px){.grid{grid-template-columns:1fr}.chips .chip{flex:1 1 100%}}
</style></head><body><header><div><h1>Relevo de Competencia</h1></div></header><main id="app" class="container"></main><footer id="foot" class="footer hidden"><div id="footin"></div></footer>

const MARCAS=['Mondelez','Nestlé','Confiteca','Costa','San Jorge','Lays','Benotti','Otra marca'];
const ROLS=['Mercaderista','Promotor','Impulsador','Vendedor','Auditor','Canjista','Otro'];
const ELEMENTOS=['Gancheras','Ventanas','Muebles','Exhibidores de piso','Material POP','Otros'];
const ACTIVIDADES=['Reposición','Ordenamiento de exhibiciones','Verificación de surtido','Impulso de ventas','Levantamiento de información','Auditoría','Inventario','Otras'];
const OPORTUNIDADES=['Mejorar precios','Incrementar visitas','Mayor cobertura de mercaderismo','Mejorar exhibición','Ampliar surtido','Fidelización','Seguimiento','Ninguna'];
const TIPOS_BEN=['Descuentos','Precios especiales','Productos bonificados','Premios','Pagos en efectivo','Vales','Otros'];
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom','Variables','No sabe'];
const YN=['Sí','No','No sabe'];
const K='relevo_express_individual_v1';const NINGUNA_MARCA='Ninguna marca competidora identificada';const FRECUENCIAS_BEN=['Semanal','Quincenal','Mensual','Trimestral','Por campaña','No sabe'];const HORARIOS_VISITA=['Mañana','Tarde','Noche','Horario variable','No sabe'];const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));const today=()=>new Date().toLocaleDateString('en-CA');
let records={},drafts={},supervisor='',current='',step=0,form=null,view='menu',filter='';try{const s=JSON.parse(localStorage.getItem(K)||'{}');records=s.records||{};drafts=s.drafts||{};supervisor=s.supervisor||''}catch(e){}
const pkey=p=>`${p.pdva}|${p.supervisor}|${today()}`;const getRows=()=>PLANNING.filter(p=>p.supervisor===supervisor);
function persist(){localStorage.setItem(K,JSON.stringify({records,drafts,supervisor}))}
function checkList(arr,selected,scope,id){return `<div class="chips">${arr.map(v=>`<label class="chip"><input type="checkbox" data-scope="${safe(scope)}" data-id="${safe(id)}" value="${safe(v)}" ${selected.includes(v)?'checked':''}>${safe(v)}</label>`).join('')}</div>`}
function sel(opts,value,scope,id,placeholder='Seleccionar'){return `<select data-scope="${safe(scope)}" data-id="${safe(id)}"><option value="">${placeholder}</option>${opts.map(v=>`<option value="${safe(v)}" ${v===value?'selected':''}>${safe(v)}</option>`).join('')}</select>`}
function field(label,html){return `<div><label>${label}</label>${html}</div>`}
function inp(type,value,scope,id,min='',ph=''){return `<input type="${type}" value="${safe(value??'')}" data-scope="${safe(scope)}" data-id="${safe(id)}" ${min!==''?`min="${min}"`:''} placeholder="${safe(ph)}">`}
function curP(){return PLANNING.find(p=>p.pdva===current&&p.supervisor===supervisor)}
function makeForm(p){return {supervisor:p.supervisor,dni:p.dni,pdva:p.pdva,afo:p.afo,nombre:p.nombre,cobertura:p.cobertura,fecha:today(),marcas:[],data:{},observacion:''}}
function st(m){return form.data[m] ||= {beneficios:'',tipos:[],frecuenciaBeneficio:'',personal:'',roles:[],visitas:{},actividades:[],visibilidad:'',elementos:[],cantidadesElementos:{},oportunidades:[]}}
function loadPDV(id){const p=PLANNING.find(x=>x.pdva===id&&x.supervisor===supervisor);if(!p)return;current=id;form=clone(drafts[pkey(p)]||records[pkey(p)]||makeForm(p));form.supervisor=p.supervisor;form.dni=p.dni;form.pdva=p.pdva;form.afo=p.afo;form.nombre=p.nombre;form.cobertura=p.cobertura;step=0;view='form';persist();render()}
function saveDraft(){const p=curP();if(p&&form){drafts[pkey(p)]=clone(form);persist()}}
function menu(){
 const list=getRows(),done=list.filter(p=>records[pkey(p)]).length;
 const sups=[...new Set(PLANNING.map(p=>p.supervisor))].sort();
 const rows=list.filter(p=>!filter||p.nombre.toLowerCase().includes(filter.toLowerCase()));
 return `<div class="panel"><div class="title-row"><h2>Mis puntos de venta</h2><span class="pill">${done} de ${list.length}</span></div>
 ${field('Selecciona tu nombre:',sel(sups,supervisor,'app','supervisor','Selecciona tu nombre'))}
 ${supervisor?`<div style="margin-top:18px"><label for="search">Buscar punto de venta</label><input id="search" type="search" placeholder="Buscar por nombre" value="${safe(filter)}" autocomplete="off"></div>
 <div class="items">${rows.map(p=>{const key=pkey(p);const estado=records[key]?'Completado':drafts[key]?'En proceso':'Pendiente';const css=records[key]?'done':drafts[key]?'draft':'';return `<button type="button" class="item" data-open="${safe(p.pdva)}"><strong>${safe(p.nombre)}</strong><span class="pill ${css}">${estado}</span></button>`}).join('')||'<p class="muted">No se encontraron puntos de venta.</p>'}</div>`:''}</div>
 <div class="panel"><h2>Reportes</h2><div class="row"><button id="export" class="outline" ${Object.keys(records).length?'':'disabled'}>Descargar Excel</button><button id="shareWhatsApp" class="success" ${Object.keys(records).length?'':'disabled'}>Compartir por WhatsApp</button></div></div>`
}
function headerForm(){const list=getRows(),ix=list.findIndex(p=>p.pdva===current);return `<div class="panel"><div class="row"><button class="secondary" id="home">← Mis PDV</button><span class="pill">PDV ${ix+1} de ${list.length}</span></div><h2 style="margin-top:12px">${safe(form.nombre)}</h2><div class="muted">Supervisor: ${safe(form.supervisor)} · Cobertura: ${safe(form.cobertura)}</div><div class="progress"><i style="width:${(step+1)*25}%"></i></div><div class="note">Paso ${step+1} de 4 · ${['Marcas','Beneficios','Visitas','Ejecución y cierre'][step]}</div></div>`}
function pageBrands(){return `<div class="panel"><h2>1. Marcas presentes en este PDV</h2>${checkList([...MARCAS,NINGUNA_MARCA],form.marcas,'form','marcas')}${form.marcas.includes('Otra marca')?field('Nombre de otra marca',inp('text',form.otraMarca,'form','otraMarca')):''}</div>`}
function pageBenefit(){return `<div class="panel"><h2>2. Beneficios comerciales</h2>${form.marcas.includes(NINGUNA_MARCA)?'<div class="info">No se registraron marcas competidoras en este PDV.</div>':''}${form.marcas.filter(m=>m!==NINGUNA_MARCA).map(m=>{const a=st(m);return `<div class="group brand"><h3>${safe(m==='Otra marca'?(form.otraMarca||m):m)}</h3>${field('¿Ofrece beneficios comerciales?',sel(YN,a.beneficios,m,'beneficios'))}${a.beneficios==='Sí'?`<div style="margin-top:9px">${field('¿Qué beneficios ofrece?',checkList(TIPOS_BEN,a.tipos||[],m,'tipos'))}${field('¿Con qué frecuencia recibe beneficios?',sel(FRECUENCIAS_BEN,a.frecuenciaBeneficio||'',m,'frecuenciaBeneficio'))}</div>`:''}</div>`}).join('')}</div>`}
function pageVisits(){return `<div class="panel"><h2>3. Visitas de la competencia</h2>${form.marcas.includes(NINGUNA_MARCA)?'<div class="info">No corresponde registrar visitas de marcas competidoras.</div>':''}${form.marcas.filter(m=>m!==NINGUNA_MARCA).map(m=>{const a=st(m);return `<div class="group brand"><h3>${safe(m==='Otra marca'?(form.otraMarca||m):m)}</h3>${field('¿Tiene personal que visita el PDV?',sel(YN,a.personal,m,'personal'))}${a.personal==='Sí'?`<div class="sectionTag">Tipos de personal</div>${checkList(ROLS,a.roles||[],m,'roles')}${(a.roles||[]).map(role=>{const r=a.visitas[role]||{};let sc=m+'§'+role;return `<div class="group role"><h3>${safe(role)}</h3><div class="grid">${field('Personas',inp('number',r.personas,sc,'personas',1,'1'))}${field('Visitas por semana',inp('number',r.semana,sc,'semana',0,'2'))}${field('Duración por visita (min)',inp('number',r.minutos,sc,'minutos',1,'60'))}${field('Origen de la información',sel(['Observación directa','Información del encargado','Programación conocida','Estimación del supervisor'],r.fuente,sc,'fuente'))}${field('Horario habitual (opcional)',sel(HORARIOS_VISITA,r.horario||'',sc,'horario'))}</div><details style="margin-top:10px"><summary style="cursor:pointer;color:var(--purple)">Días habituales (opcional)</summary>${checkList(DIAS,r.dias||[],sc,'dias')}</details></div>`}).join('')}`:''}</div>`}).join('')}</div>`}
function pageFinish(){return `<div class="panel"><h2>4. Ejecución y visibilidad</h2>${form.marcas.filter(m=>m!==NINGUNA_MARCA).map(m=>{const a=st(m);return `<div class="group brand"><h3>${safe(m==='Otra marca'?(form.otraMarca||m):m)}</h3>${a.personal==='Sí'?field('¿Qué actividades realiza su personal?',checkList(ACTIVIDADES,a.actividades||[],m,'actividades')):''}<div style="margin-top:9px">${field('¿Tiene elementos de visibilidad?',sel(YN,a.visibilidad,m,'visibilidad'))}</div>${a.visibilidad==='Sí'?`<div style="margin-top:9px">${field('¿Qué elementos tiene?',checkList(ELEMENTOS,a.elementos||[],m,'elementos'))}${(a.elementos||[]).length?`<div class="grid" style="margin-top:10px">${(a.elementos||[]).map(el=>field('Cantidad: '+safe(el),inp('number',(a.cantidadesElementos||{})[el]??'',m+'§elementos','cantidad:'+el,0,'0'))).join('')}</div>`:''}</div>`:''}<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--purple)">Oportunidades comerciales (opcional)</summary>${checkList(OPORTUNIDADES,a.oportunidades||[],m,'oportunidades')}</details></div>`}).join('')}${field('Observaciones generales (opcional)',`<textarea data-scope="form" data-id="observacion">${safe(form.observacion||'')}</textarea>`)}</div><div class="panel"><h3>Resumen del PDV</h3><p>${safe(form.nombre)} · ${form.marcas.includes(NINGUNA_MARCA)?0:form.marcas.length} marca(s) seleccionada(s)</p></div>`}
function render(){const app=document.getElementById('app'),foot=document.getElementById('foot');app.innerHTML=view==='menu'?menu():headerForm()+[pageBrands,pageBenefit,pageVisits,pageFinish][step]();foot.classList.toggle('hidden',view!=='form');if(view==='form')document.getElementById('footin').innerHTML=`<button class="secondary footBtn" id="prev">${step===0?'Salir':'Anterior'}</button><button class="${step===3?'success':''} footBtn" id="next">${step===3?'Guardar este PDV':'Siguiente'}</button>`}
function put(el){const scope=el.dataset.scope,id=el.dataset.id;if(!scope)return;if(scope==='app'){if(id==='supervisor'){supervisor=el.value;persist();render()}return}let o;if(scope==='form')o=form;else if(scope.includes('§')){const [m,role]=scope.split('§');const a=st(m);o=role==='elementos'?(a.cantidadesElementos ||= {}):(a.visitas[role] ||= {})}else o=st(scope);if(id.startsWith('cantidad:')){o[id.slice(9)]=el.value;saveDraft();return}if(el.type==='checkbox'){let arr=Array.isArray(o[id])?[...o[id]]:[];arr=el.checked?[...new Set([...arr,el.value])]:arr.filter(x=>x!==el.value);if(['Ninguna','No sabe','Variables'].includes(el.value)&&el.checked)arr=[el.value];else if(el.checked)arr=arr.filter(x=>!['Ninguna','No sabe','Variables'].includes(x));if(id==='marcas'&&arr.includes(NINGUNA_MARCA)&&el.value===NINGUNA_MARCA&&el.checked)arr=[NINGUNA_MARCA];else if(id==='marcas'&&el.checked)arr=arr.filter(x=>x!==NINGUNA_MARCA);o[id]=arr}else o[id]=el.value;if(scope!=='form'&&id==='personal'&&o.personal!=='Sí'){ /* Old role values remain hidden and are not exported when not applicable. */ }saveDraft()}
function validate(){const errors=[];if(step===0){if(!form.marcas.length)errors.push('Selecciona una marca o indica que no hay competencia');if(form.marcas.includes('Otra marca')&&!String(form.otraMarca||'').trim())errors.push('Especifica la otra marca')}if(step===1)for(const m of form.marcas.filter(m=>m!==NINGUNA_MARCA)){const a=st(m);if(!a.beneficios)errors.push(m+': beneficios');if(a.beneficios==='Sí'&&!a.tipos.length)errors.push(m+': tipos de beneficios');if(a.beneficios==='Sí'&&!a.frecuenciaBeneficio)errors.push(m+': frecuencia de beneficios')}if(step===2)for(const m of form.marcas.filter(m=>m!==NINGUNA_MARCA)){const a=st(m);if(!a.personal)errors.push(m+': personal');if(a.personal==='Sí'){if(!a.roles.length)errors.push(m+': selecciona roles');for(const role of a.roles){const r=a.visitas[role]||{};if(!(Number(r.personas)>=1))errors.push(m+'/'+role+': personas');if(r.semana===''||r.semana===undefined||!(Number(r.semana)>=0&&Number(r.semana)<=7))errors.push(m+'/'+role+': visitas semanales (0-7)');if(!(Number(r.minutos)>0))errors.push(m+'/'+role+': duración');if(!r.fuente)errors.push(m+'/'+role+': origen del dato')}}}if(step===3)for(const m of form.marcas.filter(m=>m!==NINGUNA_MARCA)){const a=st(m);if(a.personal==='Sí'&&!a.actividades.length)errors.push(m+': actividades');if(!a.visibilidad)errors.push(m+': visibilidad');if(a.visibilidad==='Sí'&&!a.elementos.length)errors.push(m+': elementos');if(a.visibilidad==='Sí')for(const el of a.elementos||[]){const n=(a.cantidadesElementos||{})[el];if(n===''||n===undefined||!Number.isInteger(Number(n))||Number(n)<0)errors.push(m+': cantidad de '+el)}}return errors}
function recordCurrent(){const p=curP(),key=pkey(p);records[key]={...clone(form),savedAt:new Date().toISOString()};delete drafts[key];persist();view='menu';form=null;current='';step=0;filter='';render();alert('Relevo guardado correctamente.')}
function nextPDV(){const remaining=getRows().find(p=>!records[pkey(p)]);if(remaining)loadPDV(remaining.pdva)}
function exportExcel(mode="download"){const r=Object.values(records);if(!r.length)return alert('No hay relevos completados');const pv=[],brands=[],visits=[];for(const f of r){const b={'Fecha':f.fecha,'Supervisor':f.supervisor,'DNI supervisor':f.dni,'PDV':f.nombre,'PDVA':f.pdva,'Código AFO':f.afo,'Ciudad / Cobertura':f.cobertura};pv.push({...b,'Marcas':f.marcas.includes(NINGUNA_MARCA)?NINGUNA_MARCA:f.marcas.map(m=>m==='Otra marca'?(f.otraMarca||m):m).join(' | '),'Observaciones':f.observacion||''});for(const m of f.marcas.filter(x=>x!==NINGUNA_MARCA)){const a=f.data[m]||{},name=m==='Otra marca'?(f.otraMarca||m):m;brands.push({...b,'Marca':name,'Beneficios':a.beneficios||'','Tipos de beneficios':a.beneficios==='Sí'?(a.tipos||[]).join(' | '):'','Frecuencia de beneficios':a.beneficios==='Sí'?(a.frecuenciaBeneficio||''):'','Personal':a.personal||'','Roles':a.personal==='Sí'?(a.roles||[]).join(' | '):'','Actividades':a.personal==='Sí'?(a.actividades||[]).join(' | '):'','Visibilidad':a.visibilidad||'','Elementos':a.visibilidad==='Sí'?(a.elementos||[]).join(' | '):'','Cantidades por elemento':a.visibilidad==='Sí'?(a.elementos||[]).map(el=>el+': '+((a.cantidadesElementos||{})[el]??'')).join(' | '):'','Oportunidades':(a.oportunidades||[]).join(' | ')});if(a.personal==='Sí')for(const role of a.roles||[]){const d=a.visitas?.[role]||{};visits.push({...b,'Marca':name,'Rol':role,'Personas':Number(d.personas||0),'Visitas semanales':Number(d.semana||0),'Minutos por visita':Number(d.minutos||0),'Días':(d.dias||[]).join(' | '),'Origen dato':d.fuente||'','Horario habitual':d.horario||'','Horas-persona semanales estimadas':Math.round(Number(d.personas||0)*Number(d.semana||0)*Number(d.minutos||0)/60*100)/100})}}}if(typeof XLSX==='undefined'){return alert('Excel requiere conexión a internet para cargar la librería. Tus registros continúan guardados en este navegador.')}const wb=XLSX.utils.book_new();for(const [n,rs] of [['PDV',pv],['Por marca',brands],['Visitas por rol',visits]])XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rs.length?rs:[{'Sin registros':''}]),n);const filename='RELEVO_COMPETENCIA.xlsx';
if(mode==='share'){
 const bytes=XLSX.write(wb,{bookType:'xlsx',type:'array'});
 const file=new File([bytes],filename,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 const whatsapp='https://wa.me/51942866837?text='+encodeURIComponent('Hola, adjunto el reporte Excel de Relevo de Competencia.');
 const esIOS=/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
 const fallback=()=>{
   try { XLSX.writeFile(wb,filename); }
   catch(e){ alert('No se pudo generar o descargar el Excel. Abre la página en Safari o Chrome e inténtalo nuevamente.'); return; }
   if(esIOS){
     alert('El Excel se ha generado. En iPhone, abre Archivos > Descargas, mantén presionado RELEVO_COMPETENCIA.xlsx, pulsa Compartir y elige WhatsApp. Selecciona el contacto y envía el archivo.');
   } else if(confirm('Excel descargado. ¿Abrir WhatsApp?')){
     window.location.href=whatsapp;
   }
 };
 // En Safari/iOS el menú nativo de compartir es la forma de adjuntar un archivo.
 // Una página web no puede escoger automáticamente el chat de destino con un adjunto.
 if(window.isSecureContext && typeof navigator.share==='function'){
   let compatible=true;
   if(typeof navigator.canShare==='function'){
     try { compatible=navigator.canShare({files:[file]}); } catch(e){ compatible=false; }
   }
   if(compatible){
     try {
       const datos=esIOS?{files:[file]}:{files:[file],title:'Relevo de Competencia'};
       return navigator.share(datos).catch(err=>{
         if(err && err.name==='AbortError')return;
         fallback();
       });
     } catch(e){ fallback(); return; }
   }
 }
 fallback();
 return;
}
XLSX.writeFile(wb,filename)}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.open){loadPDV(btn.dataset.open);scrollTo(0,0);return}if(btn.id==='home'||btn.id==='prev'&&step===0){if(view==='form')saveDraft();view='menu';form=null;current='';render();scrollTo(0,0);return}if(btn.id==='prev'){step--;render();scrollTo(0,0);return}if(btn.id==='next'){const errors=validate();if(errors.length){alert('Faltan '+errors.length+' datos:\n'+errors.slice(0,8).join('\n'));return}if(step===3){recordCurrent();return}step++;saveDraft();render();scrollTo(0,0);return}if(btn.id==='export')exportExcel();if(btn.id==='shareWhatsApp')exportExcel('share')});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.scope)return;put(el);if(el.id==='search')return;if(el.dataset.id==='supervisor'||['marcas','personal','beneficios','roles','visibilidad','elementos'].includes(el.dataset.id)){const y=scrollY;render();scrollTo(0,y)}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='search'){filter=el.value;const pos=el.selectionStart;render();const next=document.getElementById('search');next.focus();next.setSelectionRange(pos,pos);return}if(el.dataset.scope&&el.type!=='checkbox'&&el.tagName!=='SELECT')put(el)});
render();
</script></body></html>
